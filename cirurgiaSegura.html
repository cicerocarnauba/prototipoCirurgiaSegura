<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cirurgia Segura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app mobile first em coluna única (até 720px), barra de topo fixa, navegação inferior,
   ações em folhas deslizantes; no desktop a lista de checklists e o painel viram grades. */
:root{
  --bg:#F8FCFA; --surface:#FFFFFF; --surface-2:#F0F7F2; --fg:#0F2417; --muted:#52695B; --line:#DAEADF;
  --brand:#1B8A4C; --brand-alt:#2EC477; --brand-mid:#8DE2AC; --brand-ink:#0A2314; --brand-deep:#136A39; --brand-soft:#E5F7ED;
  --grad-brand:linear-gradient(135deg,#158045 0%,#28A85F 100%);
  --grad-brand-hero:linear-gradient(145deg,#0E5A31 0%,#158045 45%,#28A85F 100%);
  --grad-brand-subtle:linear-gradient(135deg,#F0FAF4 0%,#E3F7EB 100%);
  --grad-fab:linear-gradient(135deg,#147A41 0%,#27A75E 100%);
  --action:#265FE5; --action-soft:#EBF1FE;
  --neg:#D4A500; --neg-ink:#362600;
  --warn-bg:#FDF7DC; --warn-fg:#614E00;
  --danger:#C53030; --danger-soft:#FDE8E8;
  --paper:#FFFFFF; --paper-ink:#1A1F1C; --paper-line:#D9DED9;
  --focus:#1B8A4C;
  --shadow:0 2px 10px rgba(18,55,32,.04),0 1px 3px rgba(18,55,32,.02);
  --shadow-md:0 6px 20px rgba(18,55,32,.07),0 2px 6px rgba(18,55,32,.03);
  --shadow-lg:0 12px 32px rgba(18,55,32,.12),0 4px 10px rgba(18,55,32,.04);
  --f-display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{margin-inline:auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}

/* topo */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(218,234,223,.8)}
.appbar .bar{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--fg)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--grad-brand);color:#fff;font-weight:700;font-family:var(--f-display);box-shadow:0 3px 10px rgba(21,128,69,.25)}
.avatar.sm{width:34px;height:34px;font-size:13px;flex:none;display:grid;place-items:center}
.cl-bar .bar{height:auto;min-height:64px;padding-block:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;transition:all .15s ease}
.iconbtn:hover{background:var(--surface-2);border-color:var(--brand-mid)}
.titleblock{min-width:0}
.titleblock h2{font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-bar .titleblock h2{white-space:normal;overflow:visible}
.titleblock p{font-size:13px;color:var(--muted)}

.main{padding-block:20px 120px}
.pagehead{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.pagehead h1{font-size:26px}
.pagehead p{color:var(--muted)}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(218,234,223,.8);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in-nav{max-width:720px;margin-inline:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{border:0;background:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);transition:color .15s ease}
.nav button[aria-current="page"]{color:var(--brand-deep)}
.nav button[aria-current="page"] .pill{background:var(--grad-brand-subtle);color:var(--brand-deep);border:1px solid rgba(27,138,76,.22)}
.nav .pill{width:56px;height:30px;border-radius:99px;display:grid;place-items:center;transition:all .18s ease}
.fab{position:fixed;right:max(16px,calc((100vw - 720px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px;align-items:center;height:52px;padding:0 20px 0 16px;border:0;border-radius:99px;background:var(--grad-fab);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(20,122,66,.35);transition:all .18s ease}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,122,66,.42);filter:brightness(1.04)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.actionbar .wrap{display:flex;gap:10px}
.actionbar .btn.primary{flex:1}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;text-align:center;transition:all .16s ease}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(21,128,69,.24)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 18px rgba(21,128,69,.32);background:var(--grad-brand)}
.btn.primary:active{transform:none;filter:brightness(.97)}
.btn.danger{color:var(--danger);border-color:rgba(197,48,48,.3)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{min-height:42px;padding:6px 15px;font-size:14px;border-radius:11px}
.btn.lg{min-height:54px;font-size:16px}
.btn.block{width:100%}
.btn.act{background:var(--action);border-color:var(--action);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{border:0;background:none;color:var(--action);font-weight:600;padding:8px 0;text-decoration:underline;text-underline-offset:3px}

/* cartões e chips */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.run{background:var(--surface);color:var(--brand-deep);box-shadow:inset 0 0 0 1.5px var(--brand-alt)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip.ok{background:var(--grad-brand-subtle);color:var(--brand-deep);border:1px solid rgba(27,138,76,.18)}
.chip.off{background:var(--danger-soft);color:var(--danger)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 6px;min-height:44px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;text-align:center;transition:all .15s ease}
.tabs button[aria-pressed="true"]{background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(21,128,69,.22)}
.tabs.blue button[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:#fff}
.tabs .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}
.seg2{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;border:1px solid var(--line);margin-bottom:18px;gap:4px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:600;font-size:14px;color:var(--muted);transition:all .18s ease}
.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--brand-deep);box-shadow:0 2px 8px rgba(18,55,32,.08);font-weight:700}

/* lista de checklists */
.cl-list{display:grid;gap:12px;grid-template-columns:1fr}

.cl-card{text-align:left;width:100%;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--shadow);transition:all .18s ease}
.cl-card:hover{border-color:rgba(27,138,76,.35);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.cl-card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cl-card strong{font-family:var(--f-display);font-size:17px;line-height:1.25}
.cl-card .meta{font-size:13px;color:var(--muted)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:4px;background:var(--surface-2)}
.prog i.done{background:var(--grad-brand)}
.prog i.cur{background:repeating-linear-gradient(135deg,var(--brand) 0 6px,var(--brand-soft) 6px 12px)}
.cl-card .foot{font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mine{color:var(--brand-deep);font-weight:700}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;background:var(--surface)}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);font-weight:600;min-height:0}
.err:empty{display:none}
.in,.sel,.ta{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit}
.ta{min-height:96px;resize:vertical}
.in:focus,.sel:focus,.ta:focus{border-color:var(--brand-deep)}
.in:disabled,.sel:disabled,.ta:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.has-err .in,.has-err .sel,.has-err .ta,.has-err .seg span,.has-err .box{border-color:var(--danger)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
.grid2>*{min-width:0}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;flex:1 1 auto;min-width:0}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;text-align:center}
.seg input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg label.neg input:checked+span{background:var(--neg);border-color:var(--neg);color:var(--neg-ink)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.seg input:disabled+span{opacity:.6}
.seg input:disabled{cursor:not-allowed}
.salas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chk{display:flex;gap:12px;align-items:center;min-height:44px;position:relative;cursor:pointer}
.chk input{position:absolute;opacity:0;width:24px;height:24px;margin:0}
.chk .box{width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;transition:all .15s ease}
.chk input:checked+.box{background:var(--grad-brand);border-color:transparent;color:#fff}
.chk input:focus-visible+.box{outline:3px solid var(--focus);outline-offset:2px}
.chk input:disabled+.box{opacity:.6}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:420px){.checks{grid-template-columns:1fr}}
.sec{display:flex;flex-direction:column;gap:18px;margin-bottom:16px}
.sec>h3{font-size:18px}
.ident{background:var(--grad-brand-subtle);border:1px solid rgba(27,138,76,.2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ident .q{font-family:var(--f-display);font-weight:600;font-size:18px}
.note{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--surface-2)}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.bad{background:var(--danger-soft);color:var(--danger);font-weight:600}
.note.ok{background:var(--grad-brand-subtle);color:var(--brand-deep);border:1px solid rgba(27,138,76,.18)}
.team-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.team-row .sel{grid-column:1/-1}
.team-row .iconbtn{grid-column:2;grid-row:1}
.team-row>*{min-width:0}


/* etapas */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.step{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;transition:all .16s ease}
.step .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted);font-family:var(--f-display);transition:all .16s ease}
.step b{font-size:14px;font-family:var(--f-display)}
.step small{font-size:11.5px;color:var(--muted);line-height:1.2}
.step.done .c{background:var(--grad-brand);color:#fff}
.step.cur{border-color:var(--brand)}
.step.cur .c{background:var(--surface);border:2.5px solid var(--brand);color:var(--brand-deep)}
.step.sel{box-shadow:0 0 0 3px var(--brand-soft);border-color:var(--brand)}
.step.lock{opacity:.65}
.owner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.owner .txt{flex:1 1 200px;min-width:0}
.owner .txt b{display:block}
.meta-line{font-size:13px;color:var(--muted);margin-top:2px}

/* histórico */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log time{flex:none;color:var(--muted);font-size:12.5px;width:84px;font-variant-numeric:tabular-nums}
.log .what{min-width:0;overflow-wrap:anywhere}
.lockline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}

/* dashboard */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile{display:flex;flex-direction:column;gap:8px}
.tile .k{font-size:13px;font-weight:600;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--muted)}
.meter{position:relative;height:8px;border-radius:6px;background:var(--surface-2)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--grad-brand)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.tile.sent .v{color:var(--danger)}
.tile.sent.zero .v{color:var(--brand-deep)}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars .b i{width:100%;max-width:56px;background:var(--grad-brand);border-radius:8px 8px 3px 3px;min-height:4px}
.bars .b span{font-size:12px;color:var(--muted)}
.bars .b b{font-size:12.5px;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:4px 12px;align-items:center;font-size:14px}
.hbar .t{grid-column:1/-1;display:flex;justify-content:space-between}
.hbar .m{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .m i{display:block;height:100%;background:var(--grad-brand);border-radius:6px}
.sec-title{font-size:18px;margin:24px 0 12px}

/* admin */
.urow{display:flex;flex-direction:column;gap:12px;transition:all .16s ease}
.urow:hover{border-color:rgba(27,138,76,.3)}
.urow .head{display:flex;gap:12px;align-items:center}
.urow .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.urow .acts .btn:nth-child(3){grid-column:1/-1}
.urow .acts .btn{min-height:40px;padding:6px 12px;font-size:13.5px;border-radius:11px}

/* botão flutuante admin e menu speed-dial */
.admin-fab-scrim{position:fixed;inset:0;z-index:28;background:rgba(10,28,16,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:adminFadeIn .18s ease-out}
@keyframes adminFadeIn{from{opacity:0}to{opacity:1}}
.admin-fab-menu{position:fixed;right:max(16px,calc((100vw - 720px)/2 + 16px));bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:29;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;opacity:0;transform:translateY(12px) scale(.94);transition:opacity .2s cubic-bezier(.16,1,.3,1),transform .22s cubic-bezier(.16,1,.3,1)}
.admin-fab-wrap.open .admin-fab-menu{pointer-events:auto;opacity:1;transform:translateY(0) scale(1)}
.admin-fab-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow-lg);color:var(--fg);cursor:pointer;text-align:left;transition:all .18s ease}
.admin-fab-item:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 14px 32px rgba(18,55,32,.18)}
.admin-fab-text{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.admin-fab-text b{font-size:14.5px;font-family:var(--f-display);line-height:1.2;color:var(--fg)}
.admin-fab-text small{font-size:12px;color:var(--muted);margin-top:2px}
.admin-fab-icon{width:40px;height:40px;border-radius:12px;background:var(--grad-brand-subtle);color:var(--brand-deep);display:grid;place-items:center;border:1px solid rgba(46,196,119,.25);flex:none}
.fab-circle{position:fixed;right:max(16px,calc((100vw - 720px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;border:0;background:var(--grad-fab);color:#fff;display:grid;place-items:center;box-shadow:0 8px 26px rgba(20,122,66,.38);cursor:pointer;transition:transform .24s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background .2s ease}
.fab-circle:hover{transform:scale(1.06);box-shadow:0 12px 30px rgba(20,122,66,.46)}
.fab-circle .fab-icon-box{display:grid;place-items:center;transition:transform .24s cubic-bezier(.34,1.56,.64,1)}
.fab-circle.open{background:linear-gradient(135deg,#12522c 0%,#1b723e 100%)}
.fab-circle.open .fab-icon-box{transform:rotate(45deg)}

/* login */
.login{display:flex;flex-direction:column}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login-card h1{font-size:26px;line-height:1.15}
.lead{color:var(--muted)}
.demo{display:flex;flex-direction:column;gap:8px}
.demo h2{font-size:15px;color:var(--muted);font-weight:600;font-family:var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.demo button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px}
.demo button small{display:block;color:var(--muted);font-size:13px}
details.roteiro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.roteiro summary{font-weight:600;cursor:pointer}
details.roteiro ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.foot-note{font-size:13px;color:var(--muted);text-align:center}

/* folhas e avisos */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,18,12,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--fg);width:100%;max-width:430px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:21px}
.panel .btns{display:flex;gap:10px;flex-wrap:wrap}
.panel .btns .btn{flex:1 1 140px}

.switch{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px;accent-color:var(--brand-deep)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,460px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.saved{font-size:12.5px;color:var(--muted)}

/* documento de exportação */
.doc{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:20px 16px;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:14px}
.doc h3{font-size:16px;border-bottom:2px solid var(--paper-ink);padding-bottom:6px}
.doc h4{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px}
.doc dl{margin:0;display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:3px 12px}
.doc dt{color:#555}
.doc dd{margin:0;overflow-wrap:anywhere}
.doc .sig{font-size:12px;color:#555}

/* modo passo a passo */
.modebar{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;margin-bottom:16px}
.modebar button{flex:1;border:0;background:none;border-radius:11px;padding:9px 8px;font-weight:700;color:var(--muted);font-size:14px}
.modebar button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.gq{}
.gq-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.gq-count{font-variant-numeric:tabular-nums}
.gprog{height:4px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;flex:none}
.gprog i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .25s}
.qwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;justify-content:center;justify-content:safe center;overflow-y:auto;padding-block:6px;-webkit-overflow-scrolling:touch}
.qwrap.inf{animation:qf .22s ease-out}
.qwrap.inb{animation:qb .22s ease-out}
@keyframes qf{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes qb{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.gq-title{font-size:clamp(19px,4.8vw,25px);line-height:1.2;font-weight:700;letter-spacing:-.01em;color:#fff}
.gq-hint{font-size:13.5px;color:rgba(255,255,255,.88);margin-top:-4px}
.gq-body{display:flex;flex-direction:column;gap:10px}
.gq .seg{display:flex;flex-direction:column;gap:8px}
.gq .seg label{flex:none}
.gq .seg span{min-height:48px;font-size:16px;background:var(--surface);border:1.5px solid transparent;color:var(--brand-deep);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.08);transition:all .15s ease}
.gq .seg label.neg span{background:var(--neg);color:var(--neg-ink)}
.gq .seg input:checked+span{background:var(--surface);border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 3px var(--fg)}
.gq .seg label.neg input:checked+span{background:var(--neg);border-color:var(--neg-ink);color:var(--neg-ink);box-shadow:0 0 0 3px var(--neg-ink)}
.gq .in,.gq .sel{background:var(--surface);border:1.5px solid transparent;min-height:48px;font-size:17px;border-radius:14px;color:var(--fg);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.gq .in:focus,.gq .sel:focus{border-color:var(--brand-deep);outline:none}
.gq .checks{grid-template-columns:1fr;gap:6px}
.gq .chk{background:var(--surface);border-radius:12px;padding:6px 14px;min-height:46px;font-size:14.5px;font-weight:600;color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.gq .chk .box{border-color:var(--brand-deep)}
.gq .chk input{left:14px}
.gq .err{font-size:13px;background:rgba(255,255,255,.95);color:var(--danger);padding:6px 10px;border-radius:10px;font-weight:700;margin-top:2px}
.gq .btn,.gq .btn.sm{background:var(--surface);border:1.5px solid rgba(255,255,255,.8);color:var(--brand-deep) !important;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.08);border-radius:12px;padding:10px 16px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;transition:all .15s ease}
.gq .btn:hover,.gq .btn.sm:hover{background:#fff;transform:translateY(-1px);filter:brightness(.98)}
.gq .btn svg,.gq .btn.sm svg{stroke:var(--brand-deep)}
.gq .team-row .iconbtn{background:var(--surface);border:1.5px solid rgba(218,234,223,.9);color:var(--danger) !important;width:48px;height:48px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.08);display:grid;place-items:center;transition:all .15s ease}
.gq .team-row .iconbtn svg{stroke:var(--danger)}
.gq .team-row .iconbtn:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger) !important;transform:translateY(-1px)}
.rvlist{display:flex;flex-direction:column}
.rv{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;min-height:44px}
.rv:last-child{border-bottom:0}
.rv .k{color:var(--muted);font-size:13.5px;min-width:0}
.rv .v{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere;max-width:55%}

.gscreen{background:var(--grad-brand-hero);color:#fff;height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box}
@supports not (height:100dvh){.gscreen{height:100vh;max-height:100vh}}
.gscreen>.wrap{flex:1;display:flex;flex-direction:column;min-height:0;height:100%;padding:max(12px,env(safe-area-inset-top,0px)) 16px max(10px,env(safe-area-inset-bottom,0px));box-sizing:border-box;gap:10px}
.gtop{display:flex;align-items:center;gap:10px;flex:none}
.gtop .iconbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;width:38px;height:38px;border-radius:10px}
.gtop .iconbtn:hover{background:rgba(255,255,255,.3)}
.gtop .titleblock h2{font-size:16px;color:#fff}
.gtop .titleblock p{color:rgba(255,255,255,.85);font-size:12px}
.gmode{flex:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.2);color:#fff;font-weight:700;border-radius:10px;padding:0 12px;min-height:36px;font-size:13px;backdrop-filter:blur(6px);transition:all .15s ease}
.gmode:hover{background:rgba(255,255,255,.32)}
.gsteps{display:flex;gap:6px;flex:none}
.gsteps button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:34px;border:1px solid rgba(255,255,255,.25);border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:13px;padding:0 8px;transition:all .15s ease}
.gsteps button.cur{background:#fff;color:var(--brand-deep);border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.gsteps button.done{background:rgba(255,255,255,.85);color:var(--brand-deep);border-color:transparent}
.gsteps button.lock{opacity:.6}
.gmeta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);flex:none;margin-top:2px}
.qwrap.rev{justify-content:flex-start}
.gnav{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:8px;background:none}
.gnav-main{display:flex;gap:8px;width:100%}
.gnav-main .btn{min-height:50px;font-size:16px;border-radius:14px;font-weight:700}
.gnav-main .btn:not(.go){background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px);flex:0 0 auto;padding:0 18px}
.gnav-main .btn:not(.go):hover{background:rgba(255,255,255,.35)}
.gnav-main .btn.go{flex:1;background:#fff;border:none;color:var(--brand-deep);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.gnav-main .btn.go:hover{filter:brightness(.96);transform:translateY(-1px)}
.gnav-main .btn[disabled]{opacity:.4;pointer-events:none}

.gnav-sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.gnav-sub.two-col{grid-template-columns:1fr 1fr}
.g-sub-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;background:rgba(255,255,255,.94);color:var(--brand-deep);padding:8px 8px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:blur(8px);transition:all .15s ease;cursor:pointer;text-align:center;white-space:nowrap}
.g-sub-btn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.14)}
.g-sub-btn:active{transform:none}
.g-sub-btn svg{stroke:currentColor;flex:none}
.g-sub-btn.danger{color:var(--danger);background:rgba(255,255,255,.94)}
.g-sub-btn.danger:hover{background:#fff;color:#b71c1c}
.g-sub-btn.primary{background:#fff;color:var(--brand-deep)}
.g-saved-line{font-size:11.5px;color:rgba(255,255,255,.8);text-align:center;line-height:1}

/* aplicativo em coluna de celular */

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--desk);overscroll-behavior-y:none}
button,[data-act],label,input,select,textarea{touch-action:manipulation}
.shell{max-width:430px;margin-inline:auto;min-height:100dvh;background:var(--bg);position:relative}

.nav,.actionbar{left:50%;right:auto;width:100%;max-width:430px;transform:translateX(-50%)}
.fab,.fab-circle,.admin-fab-menu{right:max(16px,calc((100vw - 430px)/2 + 16px))}
.desknote{display:none}
@media(min-width:1000px){.desknote{display:flex;flex-direction:column;gap:8px;position:fixed;left:max(32px,calc((100vw - 430px)/2 - 330px));top:50%;transform:translateY(-50%);width:270px;color:var(--muted);font-size:14px}
 .desknote b{font-family:var(--f-display);font-size:20px;color:var(--fg)}}
.panel::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-top:-10px;flex:none}
.timewrap{display:flex;gap:8px;align-items:stretch}
.timewrap .in{flex:1;min-width:0}
.nowbtn{flex:none;border:1.5px solid var(--brand);background:var(--grad-brand-subtle);color:var(--brand-deep);font-weight:700;border-radius:12px;padding:0 18px;min-height:48px}
.gq .nowbtn{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--surface);min-height:66px;border-radius:16px;font-size:17px;padding:0 22px}
.cont{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;border:0;border-radius:20px;padding:18px 16px;background:var(--grad-brand-hero);color:#fff;box-shadow:0 8px 24px rgba(20,122,66,.25);transition:all .18s ease}
.cont:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,122,66,.32);filter:brightness(1.03)}
.cont .k{grid-column:1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.cont strong{grid-column:1;font-family:var(--f-display);font-size:21px;line-height:1.2;margin-top:2px;color:#fff}
.cont .s{grid-column:1;font-size:14px;color:rgba(255,255,255,.9)}
.cont .go{grid-column:2;grid-row:1/4;align-self:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.lhero{background:var(--grad-brand-hero);color:#fff;padding-block:max(40px,6vh) 84px;border-radius:0 0 32px 32px}
.lhero h1{font-size:36px;margin-top:14px;line-height:1.1;color:#fff}
.lhero p{margin-top:6px;font-size:16px;color:rgba(255,255,255,.88);max-width:30ch}
.lbody{margin-top:-52px;display:flex;flex-direction:column;gap:20px;padding-bottom:48px}
.login-card h2{font-size:22px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function doLogin(email,pass){
 var u=S.users.find(function(x){return x.email.toLowerCase()===String(email).trim().toLowerCase()});
 if(!u||!pass){S.loginErr='E-mail ou senha incorretos.';render(false);return}

function askConclude(){var c=cur(),step=S.view.step,E=vStep(c,step);
 if(Object.keys(E).length){
  if(S.mode==='guided'){var Q=qList(c,step),i=0;for(;i<Q.length;i++)if(qErr(Q[i],E))break;S.view.q=Math.min(i,Q.length-1);S.view.qTry=true;toast('Ainda há perguntas sem resposta.');render(false)}
  else{S.attempted[c.id+step]=true;render(true);var f=document.querySelector('.has-err');if(f)f.scrollIntoView({block:'center',behavior:'smooth'})}
  return}
 S.sheet={t:'confirmConclude'};renderSheet()}

 c.stepsDone[step]={by:S.me.id,at:Date.now()};
 if(STEPS[step].next){c.step=STEPS[step].next;S.view.step=c.step;S.view.q=0;S.view.qTry=false;toast(STEPS[step].n+' concluído. '+STEPS[c.step].n+' liberado.')}
 else{c.status='concluido';toast('Checklist concluído. Agora ele é somente leitura.')}
